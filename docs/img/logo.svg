<svg width="120" height="120" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="recon ctl">
  <defs>
    <linearGradient id="sweep" x1="16" y1="16" x2="28" y2="4" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4dd8c0" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#4dd8c0" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="field" cx="0.5" cy="0.5" r="0.5">
      <stop stop-color="#4dd8c0" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#4dd8c0" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- faint field -->
  <circle cx="16" cy="16" r="13" fill="url(#field)"/>
  <!-- radar sweep wedge -->
  <path d="M16 16 L16 4 A12 12 0 0 1 28 16 Z" fill="url(#sweep)"/>
  <line x1="16" y1="16" x2="16" y2="4" stroke="#4dd8c0" stroke-width="1" stroke-opacity="0.7"/>
  <!-- reticle rings -->
  <circle cx="16" cy="16" r="12" stroke="#4dd8c0" stroke-width="1.6" stroke-opacity="0.85"/>
  <circle cx="16" cy="16" r="7" stroke="#4dd8c0" stroke-width="1" stroke-opacity="0.35"/>
  <!-- crosshair ticks -->
  <g stroke="#4dd8c0" stroke-width="1.6" stroke-linecap="round">
    <line x1="16" y1="1.5" x2="16" y2="6"/>
    <line x1="16" y1="26" x2="16" y2="30.5"/>
    <line x1="1.5" y1="16" x2="6" y2="16"/>
    <line x1="26" y1="16" x2="30.5" y2="16"/>
  </g>
  <!-- center lock -->
  <circle cx="16" cy="16" r="2" fill="#4dd8c0"/>
</svg>
